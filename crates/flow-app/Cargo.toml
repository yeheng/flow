[package]
name = "flow-app"
version.workspace = true
edition.workspace = true
publish = false

# flow：统一二进制入口。原 flow-server / flow-cli / flow-executor /
# flow-agent / flow-journal-tool / journal-bench / flow-journal-server /
# flow-journal-dev 八个 bin 全部并入本 crate 的 `flow` 一个 bin，
# 以子命令区分（server / cli / executor / agent / journal-*）。
# 后端（sqlite / postgres）不在构建期区分：FLOW_BACKEND 在进程入口
# （flow_backend::open_from_env）一次性决定，两种后端共用同一份二进制。

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env", "derive"] }
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rustls.workspace = true
tracing-subscriber.workspace = true
flow-agent = { path = "../flow-agent" }
flow-backend = { path = "../flow-backend" }
flow-cli = { path = "../flow-cli" }
flow-config = { path = "../flow-config" }
flow-engine = { path = "../flow-engine" }
flow-executor = { path = "../flow-executor" }
flow-journal = { path = "../flow-journal" }
flow-rpc = { path = "../flow-rpc" }
