[package]
name = "flow-rpc"
version.workspace = true
edition.workspace = true

[features]
default = []
journal-cluster = ["flow-backend/journal-cluster"]

[dependencies]
flow-dto = { path = "../flow-dto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonrpsee = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
cron-parser = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
clap = { workspace = true, features = ["env", "derive"] }
flow-backend = { path = "../flow-backend" }
flow-journal = { path = "../flow-journal" }
flow-engine = { path = "../flow-engine" }
flow-config = { path = "../flow-config" }
sha2.workspace = true
hex.workspace = true

# 无 dev-dependencies：原 tests/（wire 契约/集群）已并入 backend-e2e 与
# remote-e2e 套件；src 内单测只用正常依赖（serde_json 等）。
