# backend-e2e：端到端测试项目（真起 flow-journal-server 进程，journal v2 产品面）。
#
# 覆盖策略（DESIGN.md §13 的延伸）：
# - 每个用例独占一个临时 journal 目录（v2 唯一权威，全新数据集），经真实
#   wire（进程外 WS + HTTP）钉 v2 协议与物化数据形状；
# - Postgres 臂已随 flow-server 退役（v1 RPC 面删除；flow-pg 保留为库，
#   其自身测试在 crates/flow-pg）。
#
# 运行：cargo test -p backend-e2e
# 环境变量：
#   RUST_LOG           透传给被测服务进程（默认 info）
[package]
name = "backend-e2e"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonrpsee = { version = "0.26", features = ["client", "ws-client"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flow-backend = { path = "../flow-backend" }
flow-rpc = { path = "../flow-rpc" }
flow-config = { path = "../flow-config" }
flow-test-support = { path = "../flow-test-support" }
rustls = { workspace = true }

# 被测二进制：与 flow-rpc 的 flow-journal-server 同源（同一份
# serve_journal_product），这里包一层薄 main，让本 crate 的集成测试能用
# env!("CARGO_BIN_EXE_flow-journal-server-e2e") 定位到「本 crate 自己构建的」
# 服务进程，不依赖外部 target 目录布局。
#
# 名字必须与 flow-rpc 的 flow-journal-server 不同：同名会写同一个
# target/debug/flow-journal-server，cargo 报 output filename collision，
# 谁覆盖谁取决于构建顺序——e2e 于是可能静默跑在 flow-rpc 的产物上。
#
# 测试基建（TempDir / 端口等待 / 就绪标记解析）在 flow-test-support：
# 与 flow-rpc 的测试同指一份，单点维护。publish = false，不进产品二进制。
[[bin]]
name = "flow-journal-server-e2e"
path = "src/bin/flow-journal-server-e2e.rs"

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
