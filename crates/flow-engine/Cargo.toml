[package]
name = "flow-engine"
version.workspace = true
edition.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:flow-journal", "flow-journal/storage", "dep:reqwest", "dep:aes-gcm"]

[dependencies]
flow-dispatcher = { path = "../flow-dispatcher" }
flow-domain = { path = "../flow-domain" }
flow-journal = { path = "../flow-journal", default-features = false, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
tracing = { workspace = true }
aes-gcm = { version = "0.10", optional = true }
hex = { workspace = true }
flow-dto = { path = "../flow-dto" }

# Shared test infrastructure; no production dependency on test processes.
[dev-dependencies]
flow-test-support = { path = "../flow-test/test-support" }
uuid = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
sha2.workspace = true

[[test]]
name = "observation"
required-features = ["runtime"]
