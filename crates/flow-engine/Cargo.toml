[package]
name = "flow-engine"
version.workspace = true
edition.workspace = true

[features]
default = ["runtime"]
runtime = ["flow-journal/storage", "dep:reqwest", "dep:rquickjs", "dep:aes-gcm"]

[dependencies]
flow-journal = { path = "../flow-journal", default-features = false }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
parking_lot = { workspace = true }
rquickjs = { workspace = true, optional = true }
libc = { workspace = true }
getrandom = { workspace = true }
interprocess = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }
aes-gcm = { version = "0.10", optional = true }
hex = { workspace = true }
flow-dto = { path = "../flow-dto" }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }

# tests/ 只用：共用测试基建（TempDir / 端口等待）。`pg` 特性拉着 sqlx/postgres +
# docker CLI 那一坨——flow-engine 的测试一个 PG 都不用，关掉省一坨编译时间。
[dev-dependencies]
flow-test-support = { path = "../flow-test-support" }
uuid = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
