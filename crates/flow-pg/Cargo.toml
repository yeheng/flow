[package]
name = "flow-pg"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "json"] }
sha2 = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
flow-engine = { path = "../flow-engine" }
flow-dto = { path = "../flow-dto" }

# tests/ 只用：共用 PG 测试库生命周期（flow-test-support::pg），与 flow-rpc 的
# ws_pg、backend-e2e 同指一份。`pg` 特性拉起 sqlx/postgres + docker CLI 那套。
[dev-dependencies]
flow-test-support = { path = "../flow-test-support" }
