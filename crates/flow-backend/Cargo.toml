[package]
name = "flow-backend"
version.workspace = true
edition.workspace = true

[features]
default = []
# 确定性故障注入（dispatch::fault）：生产构建为空壳；集成测试经下方
# dev 自依赖启用（tokio 同款模式），`cargo test` 无需手工 --features。
fault-injection = []

[dependencies]
flow-journal = { path = "../flow-journal", default-features = false, features = ["storage"] }
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
base64 = { workspace = true }
libc = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
tracing-subscriber = { workspace = true }
rcgen = { workspace = true }
clap = { workspace = true, features = ["env"] }
cron-parser.workspace = true
sqlx.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
postcard = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
flow-engine = { path = "../flow-engine" }
tokio-tungstenite = { workspace = true }
flow-dto = { path = "../flow-dto" }
flow-store = { path = "../flow-store" }
flow-config = { path = "../flow-config" }

[dev-dependencies]
# 自依赖只为给集成测试打开 fault-injection feature 的历史使命已终结：相关
# 用例（journal_fault_matrix）已迁往 remote-e2e，由那边的依赖链启用；
# dispatch::fault 在本 crate 单测下由 cfg(any(test, ..)) 自带。
flow-test-support = { path = "../flow-test-support" }
