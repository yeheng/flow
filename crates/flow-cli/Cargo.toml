# flow-cli：flow 工作流引擎的命令行客户端（bin: flow-cli）。
#
# 定位与边界（与 docs/DESIGN.md §1 一致）：
# - **纯 RPC 客户端**：只连 flow-journal-server 的 JSON-RPC 2.0 over
#   WebSocket，不依赖 flow-backend / flow-store，也不读 FLOW_BACKEND——
#   存储语义在服务端吸收，CLI 不感知后端；
# - 不直连 SQLite 或读 data_dir：避免了「绕过 published 校验直接操纵
#   事件日志」的第二条路径，CRUD 语义唯一来源仍是 RPC 层那一份实现。
#
# 覆盖：workflow 的增删改查 + 导入导出（§3），run 的手动触发与查询取消
# （run.start / run.list / run.get / run.events / run.timeline / run.cancel）。
#
# 运行：cargo run --bin flow-cli -- --help

[package]
name = "flow-cli"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "flow_cli"
path = "src/lib.rs"

[dependencies]
flow-dto = { path = "../flow-dto" }
uuid = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["env"] }
jsonrpsee = { workspace = true }
chrono = { workspace = true }
reqwest.workspace = true

# 无 dev-dependencies：原 tests/（CLI 子进程往返）已并入 backend-e2e 套件；
# src 内单测只用正常依赖（serde_json）。
