[package]
name = "conga"
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["conga contributors"]
repository = "https://github.com/YeHeng/conga"
description = "Pi-style pluggable agent core for conga"

# Vendored from https://github.com/YeHeng/conga @ 425d786
# (see crates/VENDOR.md for the sync procedure).

[lib]
name = "conga"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "time",
    "fs", "io-util", "net", "process", "signal",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging & Tracing
tracing = "0.1"

# HTTP client (providers)
reqwest = { version = "0.13", default-features = false, features = [
    "json", "rustls", "stream", "socks",
] }

# Async utilities
futures-util = "0.3.32"
async-stream = "0.3"

# Home/config dir lookup
dirs = "6"

# config.toml base config layer (env vars override the file)
toml = "0.9"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt", "ansi", "std", "env-filter",
] }
tempfile = "3"
parking_lot = "0.12"
