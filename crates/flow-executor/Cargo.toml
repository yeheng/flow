[package]
name = "flow-executor"
version.workspace = true
edition.workspace = true

[dependencies]
flow-engine = { path = "../flow-engine" }
flow-journal = { path = "../flow-journal", default-features = false, features = ["storage"] }
# 仅用 flow_home()（harness 沙箱的统一落点 FLOW_HOME/~/.flow/harness）
flow-config = { path = "../flow-config" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
# harness agent 运行时整体住在独立插件进程（agent-plugin 项目）里；
# 这里只链接其 lib 的 wire 类型（方法层契约的唯一来源），运行时不进进程。
# harness 方法层 wire 契约（DTO/错误码）：只依赖协议，不依赖 agent 实现
flow-harness-protocol = { path = "../../plugins/harness/protocol" }
proc-ipc = { path = "../proc-ipc" }
plugin-proto = { path = "../plugin-proto" }


[lib]
name = "flow_executor"
path = "src/lib.rs"
