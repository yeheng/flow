[package]
name = "flow-executor"
version.workspace = true
edition.workspace = true

[dependencies]
flow-engine = { path = "../flow-engine" }
flow-journal = { path = "../flow-journal", default-features = false, features = ["storage"] }
# 仅用 flow_home()（harness 沙箱的统一落点 FLOW_HOME/~/.flow/harness）
flow-config = { path = "../flow-config" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
# harness agent 内联运行时（裁剪自第三方 agent core/host，来源与升级流程见
# crates/VENDOR.md）。headless 内联执行：typed 配置直入、key 走参数、
# settings 不可达、状态根 RAII 钉定。版本升级需全量回归 agent e2e。
flow-harness-agent-core = { path = "../flow-harness-agent-core" }
flow-harness-agent-host = { path = "../flow-harness-agent-host" }


[lib]
name = "flow_executor"
path = "src/lib.rs"
