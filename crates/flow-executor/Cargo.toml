[package]
name = "flow-executor"
version.workspace = true
edition.workspace = true

[dependencies]
flow-engine = { path = "../flow-engine" }
flow-journal = { path = "../flow-journal" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
# conga 固定 rev（headless 内联执行：typed 配置直入、key 走参数、
# settings 不可达、状态根 RAII 钉定）。rev 变更需全量回归 agent e2e。
conga = { git = "https://github.com/yeheng/conga", rev = "425d786", default-features = false }
conga-host = { git = "https://github.com/yeheng/conga", rev = "425d786", default-features = false }


[lib]
name = "flow_executor"
path = "src/lib.rs"
