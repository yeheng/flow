[package]
name = "flow-journal"
version.workspace = true
edition.workspace = true

[features]
default = ["cli"]
storage = ["dep:rusqlite", "dep:fs2", "dep:tempfile"]
# 同库只读查询（原 flow-store 合入，T6）：sqlx 只进该 feature，
# codec/value 与 writer 的消费者不必开启。
query = ["storage", "dep:sqlx"]
cli = ["storage", "dep:clap"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
fs2 = { workspace = true, optional = true }
uuid.workspace = true
base64.workspace = true
clap = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
chrono.workspace = true
sqlx = { workspace = true, optional = true }

tempfile = { workspace = true, optional = true }

[[bin]]
name = "flow-journal-tool"
required-features = ["cli"]

[[bin]]
name = "flow-journal-bench"
required-features = ["cli"]

[dev-dependencies]
flow-test-support = { path = '../flow-test/test-support' }
