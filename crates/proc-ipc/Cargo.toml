[package]
name = "proc-ipc"
version.workspace = true
edition.workspace = true
publish = false

# 进程间字节通道（传输层）：只负责「拉起一个子进程并和它说字节」。
#
# 为什么单独成 crate：这个 crate 是跨语言边界的地基 —— 传输层一旦掺进
# 协议语义（消息目录、帧格式、版本号），它就既不能被 flow 之外的进程
# 复用，也不能被非 Rust 实现照抄。这里刻意**零 flow 依赖、零协议依赖**：
# 它只认字节，不认 JSON-RPC，也不认 postcard。
#
# 不变量（改动时必须守住）：
# 1. 子进程只拿到一条字节通道；其余继承 fd 一律 CLOEXEC 收敛（unix），
#    凭据类环境变量不继承（env_clear + 显式白名单）。
# 2. 通道凭据：unix 是「fd 即能力」（不设令牌）；其余平台是「随机令牌
#    回验」（named pipe 名字本机可见，毫秒窗口内可被抢连）。
# 3. 进程必须被回收：会话关闭时杀整棵进程树并 wait/reap，不留僵尸。

[dependencies]
tokio = { workspace = true, features = ["process", "io-util", "net", "rt", "macros", "time"] }
libc = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }

[target.'cfg(not(unix))'.dependencies]
interprocess = { workspace = true }
