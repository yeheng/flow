[package]
name = "plugin-proto"
version.workspace = true
edition.workspace = true
publish = false

# 对外插件协议层：显式信封 + JSON-RPC 2.0 子集 + initialize 握手。
#
# 与 proc-ipc 的关系：proc-ipc 只负责「拉起子进程并和它说字节」，
# 本 crate 定义「字节里装的是什么」。它不依赖 proc-ipc —— 协议层对
# 承载零假设：本地 socket、named pipe、TCP 都行，只要是「可靠有序的
# 字节流」。这是刻意的：跨语言实现者只需要照抄 docs/protocol/wire.md
# 和 tests/vectors/，不需要理解任何 Rust 传输代码。
#
# 为什么不用 postcard 做 wire 格式：postcard 把类型编号（枚举变体索引）、
# 字段顺序、兼容性策略全部藏进 Rust 类型系统，跨语言实现者看不见也
# 对不齐。对外契约必须是显式的、可版本化的、带 golden vectors 的。

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
thiserror = { workspace = true }

[dev-dependencies]
# 端到端测试用：拉起 Python 参考实现（examples/plugin-py）走完整握手。
# 仅 dev 依赖 —— 协议层本身对承载零依赖，不因测试反向耦合传输层。
proc-ipc = { path = "../proc-ipc" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
