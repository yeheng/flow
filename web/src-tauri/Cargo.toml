[package]
name = "flow-desktop"
version = "0.1.0"
description = "Flow desktop workflow editor"
edition = "2021"

# The desktop shell has its own lockfile and platform dependencies.
# Backend-only workspace builds must not require a WebView toolchain.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
flow-backend = { path = "../../crates/flow-backend" }
flow-rpc = { path = "../../crates/flow-rpc" }
jsonrpsee = { version = "0.26", features = ["server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
