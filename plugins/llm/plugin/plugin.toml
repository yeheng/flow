[plugin]
id = "llm"
name = "Model Call"
version = "0.1.0"
entry = "bin/flow-llm-plugin"
protocol = 1
node_types = ["llm"]

[methods]
invoke = "llm/invoke"

# llm 节点的参数是逐节点的（url/body/headers/credential/timeout），
# 插件级配置暂无——provider 级 defaults 出现真实需求再声明 [config]。

[ui]
[ui.palette]
category = "ai"
icon_key = "model"

[ui.run_view]
summary_keys = ["status", "body_bytes"]

# 09 权限模型：能力需求上限（安装授予面见设置页；workflow/node 层再收窄）。
# llm 节点的 URL 与凭据引用都是逐节点参数，无法在插件层枚举 → 族级上限。
[permissions]
schema = 1
required_features = ["master-permit-v1"]

[[permissions.capabilities]]
id = "model-http"
action = "net"
any = true
required = true

[[permissions.capabilities]]
id = "model-key"
action = "secret"
any = true
required = false
