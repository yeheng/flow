# flow 统一配置示例。复制为 flow.toml（搜索顺序：--config / FLOW_CONFIG 显式路径
# → ./flow.toml → flow 主目录 ~/.flow/flow.toml），或放到 flow-journal-server 工作目录。
# flow 主目录（FLOW_HOME 环境变量可覆盖，缺省 ~/.flow）统一承载：flow.toml 配置、
# journal 数据库（journal/）、storage 数据目录（data/）、harness agent 沙箱（harness/）。
# 分层：CLI 参数 > 环境变量（FLOW_* 全部保留）> 本文件 > 内置默认值。
# 本文件列出的是**非默认值或常用项**；全部字段见 crates/flow-config/src/lib.rs。
# Web 设置页（/settings）保存时整文件重写，手工注释不会保留。
# 旧 [server].rpc_addr / http_addr / scheduler_tick_secs 与 [pg] 段已随 v1
# 后端删除（deny_unknown_fields：存量配置里的旧键会显式报错）。

[server]
# cron 调度器开关（原 FLOW_SCHEDULER=off）
scheduler_enabled = true
# journal 触发器扫描 tick（秒）
journal_trigger_tick_secs = 20

[storage]
# journal 是唯一后端（JSONL v2 权威；sqlite / postgres（v1）已删除，
# 历史数据不迁移，见 docs/SQLITE_V1_TO_V2_MIGRATION.md）
backend = "journal"
# 数据目录（原 FLOW_DATA_DIR；密钥存储在这里，journal 权威在 [journal].data_dir）
# 相对路径相对 flow 主目录解析（data → ~/.flow/data），绝对路径原样
data_dir = "data"

[execution]
# unix 缺省 ipc（执行器子进程，终态）；Windows 过渡态缺省 in_process。
# 显式值：ipc（本机执行器子进程）| remote（远程 agent）| in_process（仅非 unix）
# T7：unix 上进程内执行路径已删除，配 in_process 会在配置校验处明确报错。
mode = "ipc"
# 执行器二进制（原 FLOW_EXECUTOR_BIN）；注释掉 = 定位同目录兄弟 flow-executor
# executor_bin = "/usr/local/bin/flow-executor"
# IPC 执行槽位（1..=16）
x_max = 4
# 启动时预热一个空闲执行器：省去首次派发的进程启动 + 握手延迟，代价是
# 常驻一个空闲进程（占用一个 x_max 槽位）。桌面 app 默认开启，服务端默认关闭。
# prewarm = false

# mode = "remote" 时必填（control_addr + 证书三件套 + 超时；原 FLOW_REMOTE_* 四件套）
# [execution.remote]
# control_addr = "10.0.0.8:9700"
# ca_cert = "/etc/flow/ca.pem"
# cert = "/etc/flow/server.pem"
# key = "/etc/flow/server.key"
# attach_timeout_ms = 120000
# WSS 接入（T13，代理终止 TLS 场景的附加承载）：与凭据映射表成对配置。
# wss_addr = "0.0.0.0:9710"
# 身份由 token 反查 agent_id（每 agent 一张凭证，不共享）；客户端自报的
# x-flow-agent-id 头只做一致性断言。id 与 token 在表内都不得重复。
# [[execution.remote.agents]]
# id = "agent-1"
# token = "agent-1 的接入令牌"
# [[execution.remote.agents]]
# id = "agent-2"
# token = "agent-2 的接入令牌"

# `flow-agent` 的部署参数（原先只能 CLI 参数 / 环境变量；CLI flag 仍可逐项覆盖）
# [agent]
# control_addr = "10.0.0.8:9700"
# agent_id = "agent-1"
# ca_cert = "/etc/flow/ca.pem"
# cert = "/etc/flow/agent-1.pem"
# key = "/etc/flow/agent-1.key"
# executor_bin = "/usr/local/bin/flow-executor"
# slots = 4
# WSS 上联（T13，反向代理终止 TLS 场景）；设置后优先于 mTLS 直连，证书可省。
# wss_url = "ws://127.0.0.1:9710/ws/agent"
# token = "本 agent 的接入令牌（FLOW_AGENT_TOKEN）；master 按 token→agent_id 映射表反查身份"

# `flow-journal-server`（JSONL v2 产品服务）；token 仍是环境变量 FLOW_JOURNAL_TOKEN（凭据不进配置文件）
# [journal]
# addr = "127.0.0.1:9802"
# http_addr = "127.0.0.1:9803"
# data_dir = "/var/lib/flow/journal"   # 缺省 = flow 主目录下 journal（~/.flow/journal）

# 明确**不进配置文件**的配置（保持现状）：
# - RUST_LOG（tracing env-filter 惯例）
# - FLOW_SECRET_*（密钥，Web 设置页可管理；执行时 stored 优先、env 兜底）
# - FLOW_JOURNAL_TOKEN（每工作区凭据，仅环境变量）
# - 执行协议常量（帧上限/超时族，crates/flow-engine/src/execution_protocol/contract.rs，改即协议变更）
# - FLOW_RUN_LOG_BUDGET 等 engine 内部预算（读取点在 driver 深处，维持环境变量）

# harness 节点 agent 模式（内置 flow-harness-agent，复用 conga-host 无头装配）
# base_url 与 model 成对配置才启用；api_key 不在这里——节点参数只存密钥名称，
# 真值经密钥管理（secrets.*：stored 优先、FLOW_SECRET_* 兜底）下发。
# [harness.agent]
# base_url = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# api = "openai"                  # openai（OpenAI 兼容，默认）| anthropic
# proxy = "http://127.0.0.1:7890" # 禁止 userinfo/query（代理凭据不进请求/journal）
# max_turns = 50                  # 1..=200
# max_tool_calls_per_turn = 20    # 1..=100
# max_tokens = 4096               # 1..=1_000_000
# tool_timeout_secs = 600         # 省略 = 无引擎级工具超时（取消/超时由 executor 杀进程组）
