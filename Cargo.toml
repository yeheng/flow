[workspace]
resolver = "2"
members = [
    "crates/flow-agent",
    "crates/flow-app",
    "crates/flow-executor",
    "crates/flow-journal",
    "crates/flow-engine",
    "crates/flow-pg",
    "crates/flow-store",
    "crates/flow-backend",
    "crates/flow-dto",
    "crates/flow-config",
    "crates/flow-rpc",
    "crates/flow-cli",
    "crates/flow-test-support",
    "crates/backend-e2e",
    "crates/backend-perf",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4.6", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
parking_lot = "0.12"
fs2 = "0.4"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono"] }
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }
cron-parser = "0.12"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rquickjs = "0.14"
libc = "0.2"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
x509-parser = "0.17"
rcgen = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"

[profile.dev]
debug = 1
