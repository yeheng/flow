[workspace]
resolver = "2"
members = [
    # 插件 SDK：protocol（wire 契约）+ ipc（传输）单向分层（T7 合并
    # 原 proc-ipc/plugin-proto；跨语言契约本体仍是 wire.md + vectors）
    "crates/flow-plugin-sdk",
    "crates/flow-agent",
    "crates/flow-plugin-runtime",
    "crates/flow-journal",
    # 内置节点实现库（T4）：Script/Condition 求值器等静态实现
    "crates/flow-internal-plugins",
    "crates/flow-engine",
    "crates/flow-backend",
    "crates/flow-dto",
    "crates/flow-config",
    "crates/flow-rpc",
    "crates/flow-cli",
    # 插件（T3）：独立版本与独立进程，但共享根 workspace 与锁文件
    "plugins/harness/protocol",
    "plugins/harness/agent-core",
    "plugins/harness/agent-host",
    "plugins/harness/plugin",
    "plugins/llm/plugin",
    # 测试归组（T2）：基建/单机 e2e/远程 e2e/性能各自独立 package
    "crates/flow-test/test-support",
    "crates/flow-test/e2e",
    "crates/flow-test/e2e-remote",
    "crates/flow-test/performance",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4.6", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
parking_lot = "0.12"
fs2 = "0.4"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono"] }
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }
cron-parser = "0.12"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rquickjs = "0.14"
libc = "0.2"
getrandom = "0.4"
interprocess = { version = "2", features = ["tokio"] }
postcard = { version = "1", features = ["use-std"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
x509-parser = "0.18"
rcgen = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
dirs = "7"
toml = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
base64 = "0.23"
tempfile = "3"
# bundled：局部构建（如 -p flow-executor）的依赖树里没有 sqlx 去点亮
# libsqlite3-sys/bundled，Windows 没有系统 sqlite3.lib 可链（LNK1181）；
# workspace 全量构建经 sqlx 特性统一本就是 bundled，这里只是补齐孤立树。
rusqlite = { version = "0.38", features = ["backup", "bundled"] }

[profile.dev]
debug = 1
