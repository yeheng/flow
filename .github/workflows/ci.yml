name: CI

# 每次提交都跑：任意分支的 push + 所有 PR
on:
  push:
  pull_request:

# 同一分支连续推送时取消上一次在跑的，省 runner 分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ================= 多架构总览 =================
  # 公开仓库白用 arm64 标准 runner（ubuntu-24.04-arm，4 vCPU），所以 Rust 的
  # 编译 / 测试全部用**原生双 runner** 铺开：x86_64 与 aarch64 各在
  # 自己的架构上跑，全程不靠 qemu 模拟（慢 5-10 倍、偶发挂）。
  # 私有仓库也能用 arm64 标准 runner（计费、2 vCPU）；实在不想要 arm 时，
  # 删掉各矩阵里的 aarch64 项即可退回单架构，其余配置不用动。
  # runner 一律钉 ubuntu-24.04：ubuntu-latest 正在向 26.04 迁移（2026-10 起），
  # 钉住版本免得某天开始悄悄换镜像。

  # ---- Rust 门禁：fmt / clippy ----
  # 与目标架构无关，一个 runner 走完。真正的测试在下面的架构矩阵里，两个
  # 架构都全量跑（DESIGN.md §13 的验证命令一条不少）。
  lint:
    name: fmt / clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 格式：仓库已 cargo fmt --all 过，这里只做守门
      - name: fmt
        run: cargo fmt --all -- --check

      # lints 全开，一个 warning 都不放过（DESIGN.md §13 的验证命令）
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---- 测试矩阵：x86_64 + aarch64 原生各跑一遍全量 ----
  test:
    name: test (${{ matrix.arch.target }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      # 一个架构挂掉不取消另一个：两个架构的结论都要拿到
      fail-fast: false
      matrix:
        arch:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch.target }}
      # key 必须带 target：两个架构的增量产物不共缓存，否则 arm runner 会
      # 抽到 x64 的 target/ 再整体重建一遍
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch.target }}
      # --all-targets：lib / bins / tests / benches / examples 一起验。
      # Local and remote-agent tests use the same single-master journal build.
      # 先产出普通二进制：cargo test 不落 target/<triple>/<profile>/flow-*，
      # 而 remote/IPC 集成测试按工作区布局定位真实二进制（flow-test-support
      # 的 workspace_bin）——不先 build 就会 panic "binary not built"。
      - name: build workspace bins
        run: cargo build --workspace --bins --locked --target ${{ matrix.arch.target }}
      - name: test
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.arch.target }}

  # ---- CLI 二进制矩阵：Linux / Windows / macOS 七个 target 全量构建 ----
  # 产物打 zip（内含版本号）+ sha256 上传 artifact，合入即可下载试用；
  # Windows 补齐桌面产品面，macOS 补齐日常开发平台。
  # gnu target 用各自架构的原生 runner 编（与 test 矩阵同一批 runner）：
  # cross 的 gnu 镜像 glibc 太旧，新版 Rust std 的 getrandom 弱符号在链接期
  # 解析不到（undefined reference to getrandom），musl 镜像不受影响。
  # musl 全静态，拷到服务器或 scratch 容器里直接能跑；C 依赖（rquickjs 的
  # cc 构建）由 cross 镜像内的目标架构工具链解决。
  # macos-13 Intel runner 已退役：aarch64 原生编，x86_64 在 arm 机上交叉编。
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            use-cross: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            use-cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            use-cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use-cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # aws-lc-sys 在 MSVC 上要 nasm 汇编器（与 windows-check 同一原因）
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: taiki-e/install-action@cross
        if: matrix.use-cross
      # cross 在容器里换着工具链编译，增量产物与原生 cargo 不通用，单独一份 key
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.use-cross && 'cross-' || '' }}${{ matrix.target }}-build
      # shell: bash：Windows runner 走 git bash，三平台共用同一段脚本
      - name: build（workspace，release）
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --workspace --release --locked --target ${{ matrix.target }}
          else
            cargo build --workspace --release --locked --target ${{ matrix.target }}
          fi
      # 四个 bin 一次构建全部就位。backend-e2e 的被测进程叫 flow-journal-server-e2e
      # （与 flow-rpc 的 flow-journal-server 同一份 serve_journal_product 实现，只是改名）——
      # 同名会写同一个产物、cargo 报 output filename collision，谁覆盖谁取决于
      # 构建顺序，所以两者必须保持不同的名字。
      - name: 收集 flow-cli / flow-perf / flow-journal-server / flow-journal-server-e2e
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; else ext=""; fi
          for bin in flow-cli flow-perf flow-journal-server flow-journal-server-e2e; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$bin$ext"
          done
      # 校验产物架构与目标一致（交叉编译配错 target 时在这里拦住）。
      # Linux 查 ELF、macOS 查 Mach-O；Windows 的 git bash 没有 file，
      # 直接读 PE 头两个字节（MZ）。
      - name: 校验产物架构
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.target }}' in
            x86_64-*) want='x86-64|x86_64' ;;
            aarch64-*) want='aarch64|arm64' ;;
            *) want='?' ;;
          esac
          for f in dist/*; do
            echo "== $f"
            case '${{ runner.os }}' in
              Linux)
                file "$f" | grep -q 'ELF 64-bit' || { echo "::error::$f 不是 ELF 64"; exit 1; }
                ;;
              macOS)
                file "$f" | grep -q 'Mach-O 64-bit' || { echo "::error::$f 不是 Mach-O 64"; exit 1; }
                ;;
              Windows)
                sig=$(head -c 2 "$f" | od -An -tx1 | tr -d ' \n')
                [ "$sig" = "4d5a" ] || { echo "::error::$f 不是 PE（缺 MZ 头）"; exit 1; }
                continue
                ;;
            esac
            file "$f" | grep -Eq "$want" || { echo "::error::$f 架构不是 $want"; exit 1; }
          done
      # zip 名带 workspace 版本（Cargo.toml 的 [workspace.package] version），
      # 下载后无需解包即可分辨新旧。
      - name: 打包 zip + sha256（Linux / macOS）
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          NAME="flow-$VER-${{ matrix.target }}.zip"
          mkdir -p staging
          (cd dist && zip "../staging/$NAME" ./*)
          (cd staging && shasum -a 256 "$NAME" > "$NAME.sha256")
      - name: 打包 zip + sha256（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # [^"]* 不依赖行尾锚点：Windows checkout 的 CRLF 行尾不会让匹配落空
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]*)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $name = "flow-$ver-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force staging | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "staging/$name"
          $hash = (Get-FileHash "staging/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "staging/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.target }}
          path: staging
          if-no-files-found: error

  # ---- Windows 编译门禁 ----
  # 桌面版（Tauri）依赖 flow-backend/flow-rpc 全链，Windows 是产品面；IPC
  # 全部执行链路必须在 Windows 编译，包括本地 socket 引导与 Job 回收。
  # 真实运行测试仍需相应平台作业。
  windows-check:
    name: check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # aws-lc-sys 在 MSVC 上要 nasm 汇编器（cmake runner 已预装）
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
      - name: cargo check
        run: cargo check --workspace --locked --target x86_64-pc-windows-msvc
      - name: Executor environment policy tests
        run: cargo test -p flow-engine --no-default-features --lib execution_protocol::environment --locked --target x86_64-pc-windows-msvc

  # ---- 桌面端（Tauri）三平台构建：发版前的编译门禁 + 可下载 zip ----
  # 步骤与 release.yml 的 build job 保持同一套（那边额外校验 tag 版本并上传
  # GitHub Release，这里上传 artifact），保证 PR 阶段就能发现桌面端编不过，
  # 而不是打 tag 发版当天才发现。产物名不带版本号：CI artifact 本身按 run
  # 归档，不会混淆；正式带版本的包走 release.yml。
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # 22.04 的 glibc / webkit 版本对 AppImage 分发更友好。
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖（Tauri v2 WebKit 工具链）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys 在 MSVC 上要 nasm 汇编器
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      # 双 workspace 都要缓存：src-tauri（桌面壳）+ 根工作区（executor 及
      # 其依赖链都在根 target/ 下构建）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            web/src-tauri
          key: desktop-${{ matrix.target }}

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      # T6：桌面默认执行模式已切 ipc（unix）。flow-executor 作为 externalBin
      # 随包分发（macOS 进 Contents/MacOS/、Linux 进 bin/，与主程序同目录，
      # 满足 locate() 兄弟目录契约）。Windows 桌面仍是 in_process 过渡态
      # （B 方案），executor 是 unix-only 产品无法交叉——放占位文件让 tauri
      # externalBin 检查通过，实际不会被调用；随命名管道 transport（A 方案）
      # 再换真实产物。
      - name: 构建执行器（externalBin）
        shell: bash
        run: |
          mkdir -p web/src-tauri/bin
          # shellcheck disable=SC2193  # 矩阵表达式被换成哑字符串后该比较必为 false，属误报
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            printf 'placeholder: flow-executor is unix-only; windows desktop runs in_process (plan B)' \
              > "web/src-tauri/bin/flow-executor-${{ matrix.target }}.exe"
          else
            cargo build --release -p flow-executor --target ${{ matrix.target }}
            cp "target/${{ matrix.target }}/release/flow-executor" \
              "web/src-tauri/bin/flow-executor-${{ matrix.target }}"
          fi

      # tauri build 会先跑 tauri.conf.json 的 beforeBuildCommand（npm run build）。
      # src-tauri 是独立 workspace（自带 Cargo.lock），产物落在
      # web/src-tauri/target/<target>/release/bundle/ 下。
      - name: 构建 Tauri 应用
        working-directory: web
        run: npm run build:desktop -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 打包 zip（macOS）
        if: runner.os == 'macOS'
        run: |
          NAME="Flow-${{ matrix.name }}.zip"
          BUNDLE="web/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          mkdir -p staging
          # .app 必须用 ditto 打包：保留符号链接与权限，普通 zip 会损坏应用结构。
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE/Flow.app" "staging/$NAME"
          (cd staging && shasum -a 256 "$NAME" > "$NAME.sha256")

      - name: 打包 zip（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Flow-${{ matrix.name }}.zip"
          $bundle = "web/src-tauri/target/${{ matrix.target }}/release/bundle"
          New-Item -ItemType Directory -Force staging | Out-Null
          $files = @(Get-ChildItem "$bundle/msi/*.msi") + @(Get-ChildItem "$bundle/nsis/*.exe")
          if ($files.Count -eq 0) { throw "bundle 目录里没有 msi/nsis 产物" }
          Compress-Archive -Path $files.FullName -DestinationPath "staging/$name"
          $hash = (Get-FileHash "staging/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "staging/$name.sha256"

      # 绿色版：免安装，zip 里只有一个改名后的主程序，解压即运行
      # （仍依赖系统 WebView2 运行时，Win11 与多数 Win10 已预装）。
      - name: 打包 zip（Windows 绿色版）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Flow-${{ matrix.name }}-portable.zip"
          $exe = "web/src-tauri/target/${{ matrix.target }}/release/flow-desktop.exe"
          if (-not (Test-Path $exe)) { throw "找不到便携版可执行文件：$exe" }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item $exe "portable/Flow.exe"
          Compress-Archive -Path "portable/Flow.exe" -DestinationPath "staging/$name"
          $hash = (Get-FileHash "staging/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "staging/$name.sha256"

      - name: 打包 zip（Linux）
        if: runner.os == 'Linux'
        run: |
          NAME="Flow-${{ matrix.name }}.zip"
          BUNDLE="web/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p staging
          zip -j "staging/$NAME" "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb
          (cd staging && sha256sum "$NAME" > "$NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: flow-desktop-${{ matrix.name }}
          path: staging
          if-no-files-found: error

  # ---- 前端：单架构 ----
  # lint / 单测 / 构建都是 node 侧的事，与 CPU 架构无关；playwright 的 e2e 里
  # 真二进制 flow-journal-server 的架构覆盖已由上面的 test 矩阵负责（那边是全量 Rust
  # 测试），这里再铺一遍 arm 属于重复。想扩成双架构时：runs-on 换成
  # matrix.arch.runner、rust-toolchain 加 targets、rust-cache 加 key，
  # 与 test job 同构即可。
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # global-setup 自行 cargo build 并拉起隔离的 flow-journal-server
      - run: npm run test:e2e
