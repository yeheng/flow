name: CI

# 每次提交都跑：任意分支的 push + 所有 PR
on:
  push:
  pull_request:

# 同一分支连续推送时取消上一次在跑的，省 runner 分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ================= 多架构总览 =================
  # 公开仓库白用 arm64 标准 runner（ubuntu-24.04-arm，4 vCPU），所以 Rust 的
  # 编译 / 测试全部用**原生双 runner** 铺开：x86_64 与 aarch64 各在
  # 自己的架构上跑，全程不靠 qemu 模拟（慢 5-10 倍、偶发挂）。
  # 私有仓库也能用 arm64 标准 runner（计费、2 vCPU）；实在不想要 arm 时，
  # 删掉各矩阵里的 aarch64 项即可退回单架构，其余配置不用动。
  # runner 一律钉 ubuntu-24.04：ubuntu-latest 正在向 26.04 迁移（2026-10 起），
  # 钉住版本免得某天开始悄悄换镜像。

  # ---- Rust 门禁：fmt / clippy ----
  # 与目标架构无关，一个 runner 走完。真正的测试在下面的架构矩阵里，两个
  # 架构都全量跑（DESIGN.md §13 的验证命令一条不少）。
  lint:
    name: fmt / clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 格式：仓库已 cargo fmt --all 过，这里只做守门
      - name: fmt
        run: cargo fmt --all -- --check

      # lints 全开，一个 warning 都不放过（DESIGN.md §13 的验证命令）
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---- 测试矩阵：x86_64 + aarch64 原生各跑一遍全量 ----
  test:
    name: test (${{ matrix.arch.target }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      # 一个架构挂掉不取消另一个：两个架构的结论都要拿到
      fail-fast: false
      matrix:
        arch:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch.target }}
      # key 必须带 target：两个架构的增量产物不共缓存，否则 arm runner 会
      # 抽到 x64 的 target/ 再整体重建一遍
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch.target }}
      # --all-targets：lib / bins / tests / benches / examples 一起验。
      # （v1 的 Postgres 后端与 flow-pg 测试臂已随后端删除，无 PG 依赖。）
      - name: test
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.arch.target }}

  # ---- 多架构构建：cross 交叉编译四个 Linux target ----
  # 为什么用 cross 而不是把 aarch64 也放到 arm runner 上原生编：单 runner 铺完
  # 四个 target（gnu / musl × amd64 / arm64）；musl 全静态，拷到服务器或
  # scratch 容器里直接能跑。C 依赖（rquickjs 的 cc 构建）由 cross 镜像内的
  # 目标架构工具链解决，不用在 runner 上装交叉 gcc，也不需要 qemu。
  # 这里是编译验证 + 出产物，测试已由上面的原生矩阵覆盖。某个 cross 镜像抽风
  # 时，从矩阵里摘掉对应 target 即可，其余项不受影响。
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      # cross 在容器里换着工具链编译，增量产物与原生 cargo 不通用，单独一份 key
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      - name: cross build（workspace，release）
        run: cross build --workspace --release --locked --target ${{ matrix.target }}
      # 四个 bin 一次构建全部就位。backend-e2e 的被测进程叫 flow-journal-server-e2e
      # （与 flow-rpc 的 flow-journal-server 同一份 serve_journal_product 实现，只是改名）——
      # 同名会写同一个产物、cargo 报 output filename collision，谁覆盖谁取决于
      # 构建顺序，所以两者必须保持不同的名字。
      - name: 收集 flow-cli / flow-perf / flow-journal-server / flow-journal-server-e2e
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in flow-cli flow-perf flow-journal-server flow-journal-server-e2e; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          done
      - name: 校验产物是目标架构的 ELF
        run: |
          set -euo pipefail
          case '${{ matrix.target }}' in
            x86_64-*) want='x86-64' ;;
            aarch64-*) want='aarch64' ;;
            *) want='?' ;;
          esac
          for f in dist/*; do
            echo "== $f"
            file "$f"
            file "$f" | grep -q 'ELF 64-bit' || { echo "::error::$f 不是 ELF 64"; exit 1; }
            file "$f" | grep -q "$want" || { echo "::error::$f 架构不是 $want"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # ---- 前端：单架构 ----
  # lint / 单测 / 构建都是 node 侧的事，与 CPU 架构无关；playwright 的 e2e 里
  # 真二进制 flow-journal-server 的架构覆盖已由上面的 test 矩阵负责（那边是全量 Rust
  # 测试），这里再铺一遍 arm 属于重复。想扩成双架构时：runs-on 换成
  # matrix.arch.runner、rust-toolchain 加 targets、rust-cache 加 key，
  # 与 test job 同构即可。
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # global-setup 自行 cargo build 并拉起隔离的 flow-journal-server
      - run: npm run test:e2e
