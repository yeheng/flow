name: CI

# 每次提交都跑：任意分支的 push + 所有 PR
on:
  push:
  pull_request:

# 同一分支连续推送时取消上一次在跑的，省 runner 分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ================= 多架构总览 =================
  # 公开仓库白用 arm64 标准 runner（ubuntu-24.04-arm，4 vCPU），所以 Rust 的
  # 编译 / 测试 / PG e2e 全部用**原生双 runner** 铺开：x86_64 与 aarch64 各在
  # 自己的架构上跑，docker 在各自 runner 上拉到的 postgres 镜像就是对应架构
  # （linux/amd64 / linux/arm64），全程不靠 qemu 模拟（慢 5-10 倍、偶发挂）。
  # 私有仓库也能用 arm64 标准 runner（计费、2 vCPU）；实在不想要 arm 时，
  # 删掉各矩阵里的 aarch64 项即可退回单架构，其余配置不用动。
  # runner 一律钉 ubuntu-24.04：ubuntu-latest 正在向 26.04 迁移（2026-10 起），
  # 钉住版本免得某天开始悄悄换镜像。

  # ---- Rust 门禁：fmt / clippy ----
  # 与目标架构无关，一个 runner 走完。真正的测试在下面的架构矩阵里，两个
  # 架构都全量跑（DESIGN.md §13 的验证命令一条不少）。
  lint:
    name: fmt / clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 格式：仓库已 cargo fmt --all 过，这里只做守门
      - name: fmt
        run: cargo fmt --all -- --check

      # lints 全开，一个 warning 都不放过（DESIGN.md §13 的验证命令）
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---- 测试矩阵：x86_64 + aarch64 原生各跑一遍全量 ----
  test:
    name: test (${{ matrix.arch.target }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      # 一个架构挂掉不取消另一个：两个架构的结论都要拿到
      fail-fast: false
      matrix:
        arch:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch.target }}
      # key 必须带 target：两个架构的增量产物不共缓存，否则 arm runner 会
      # 抽到 x64 的 target/ 再整体重建一遍
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch.target }}
      # --all-targets：lib / bins / tests / benches / examples 一起验。
      # backend-e2e 的 PG 臂自己用 docker 起容器（默认 postgres:16-alpine），
      # runner 自带 docker；本 job 在哪个架构上跑，那遍 PG e2e 就是对应架构的
      # 原生 e2e——「多架构 PostgreSQL e2e」的主覆盖就在这里（arm64×16 与
      # amd64×16）。flow-pg / flow-rpc 的 PG 用例此刻仍静默跳过（没有
      # FLOW_TEST_DATABASE_URL），由下面的 postgres / e2e-postgres 两个矩阵补上。
      - name: test
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.arch.target }}

  # ---- Postgres 臂：flow-pg / flow-rpc 真连 PG ----
  # 主测试 job 不设 FLOW_TEST_DATABASE_URL，这些用例会静默跳过、依旧全绿；
  # 这里把 PG 臂真正跑起来（端口 54329 与仓库约定一致）。
  # 矩阵两个维度：runner 架构 × PG 大版本（15/16/17 是依赖的两个 PG 特性的
  # 共同下界：DROP DATABASE ... WITH (FORCE) 需 PG 13+，LISTEN/NOTIFY 全版本都有）。
  # PG 不用 services: 而是本 job 自己 docker run，两个原因：
  # 1. arm runner 上与 x64 行为完全一致，不依赖 service container 在各架构
  #    runner 上的支持度；
  # 2. 能显式 --platform 把架构钉死：amd64 runner 上跑 linux/amd64 的 PG，
  #    arm64 runner 上跑 linux/arm64 的 PG——「多架构 PostgreSQL」是断言出来的，
  #    不是顺带发生的。
  postgres:
    name: test (pg ${{ matrix.pg }}, ${{ matrix.arch.platform }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
        pg: ["15", "16", "17"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch.target }}
      # 同一架构的三个大版本共用一份编译缓存：PG 版本不影响 Rust 产物
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch.target }}
      - name: 起 Postgres 容器（钉平台 ${{ matrix.arch.platform }}）
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name flow-test-pg \
            --platform ${{ matrix.arch.platform }} \
            -e POSTGRES_USER=flow \
            -e POSTGRES_PASSWORD=flow \
            -e POSTGRES_DB=flow \
            -p 127.0.0.1:54329:5432 \
            postgres:${{ matrix.pg }}-alpine
          # PG 没就绪就开跑，这些用例不会失败而是静默跳过——那等于绿灯造假。
          # 所以显式等到 pg_isready 通过，超时就红，并附容器日志。
          for _ in $(seq 1 90); do
            if docker exec flow-test-pg pg_isready -U flow -d flow; then
              echo "Postgres ${{ matrix.pg }} (${{ matrix.arch.platform }}) 就绪"
              exit 0
            fi
            sleep 1
          done
          echo "::error:: Postgres ${{ matrix.pg }} 90s 未就绪"
          docker logs flow-test-pg || true
          exit 1
      - name: test (flow-pg + flow-rpc)
        env:
          FLOW_TEST_DATABASE_URL: postgres://flow:flow@127.0.0.1:54329/flow
        run: cargo test -p flow-pg -p flow-rpc --all-targets --locked --target ${{ matrix.arch.target }}
      - name: 清理容器
        if: always()
        run: docker rm -f -v flow-test-pg || true

  # ---- 后端 e2e × PG 大版本 ----
  # backend-e2e 的 PG 臂自己起容器（镜像由 FLOW_E2E_PG_IMAGE 指定，默认
  # postgres:16-alpine），上面 test 矩阵已把它在 amd64×16 与 arm64×16 上各
  # 原生跑过一遍。这里在 amd64 上补 15 / 17 两个大版本：版本兼容性与 CPU
  # 架构无关，arm64 × 每个大版本再复制一遍收益不成比例（需要时把 pg 列表
  # 补全即可，job 结构不用动）；arm64 的版本兼容由上面的 postgres 矩阵覆盖
  # （flow-pg / flow-rpc × 15/16/17）。
  e2e-postgres:
    name: e2e (backend, pg ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "17"]
    env:
      FLOW_E2E_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # backend-e2e 自己管容器：label com.flow.e2e=1、数据目录 tmpfs、
      # rm -f -v + 孤儿匿名 volume 回收（见 DESIGN.md §13「docker 卫生」）
      - name: e2e (backend, sqlite + postgres ${{ matrix.pg }})
        run: cargo test -p backend-e2e --all-targets --locked

  # ---- 断言 postgres 镜像本身是多架构 ----
  # 原生矩阵只能证明「本 runner 架构上跑通了」；这个 job 直接查镜像 manifest，
  # 钉住 postgres:{15,16,17}-alpine 同时提供 linux/amd64 与 linux/arm64——
  # 换镜像、或上游某天砍掉一个架构时，这里先红。
  pg-image:
    name: postgres 镜像多架构 manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 校验 manifest 含 linux/amd64 + linux/arm64
        run: |
          set -uo pipefail
          fail=0
          for pg in 15 16 17; do
            image="postgres:${pg}-alpine"
            echo "== $image =="
            out="$(docker buildx imagetools inspect "$image" 2>&1)" || {
              echo "$out"; echo "::error:: 读不到 $image 的 manifest"; fail=1; continue; }
            echo "$out"
            # 默认输出里每个平台一行 "Platform:  linux/<arch>"
            echo "$out" | grep -q 'linux/amd64' || { echo "::error::$image 缺 linux/amd64"; fail=1; }
            echo "$out" | grep -q 'linux/arm64' || { echo "::error::$image 缺 linux/arm64"; fail=1; }
          done
          exit "$fail"

  # ---- 多架构构建：cross 交叉编译四个 Linux target ----
  # 为什么用 cross 而不是把 aarch64 也放到 arm runner 上原生编：单 runner 铺完
  # 四个 target（gnu / musl × amd64 / arm64）；musl 全静态，拷到服务器或
  # scratch 容器里直接能跑。C 依赖（rquickjs 的 cc 构建）由 cross 镜像内的
  # 目标架构工具链解决，不用在 runner 上装交叉 gcc，也不需要 qemu。
  # 这里是编译验证 + 出产物，测试已由上面的原生矩阵覆盖。某个 cross 镜像抽风
  # 时，从矩阵里摘掉对应 target 即可，其余项不受影响。
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      # cross 在容器里换着工具链编译，增量产物与原生 cargo 不通用，单独一份 key
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      - name: cross build（workspace，release）
        run: cross build --workspace --release --locked --target ${{ matrix.target }}
      # flow-rpc 与 backend-e2e 各有一个同名 bin flow-server（cargo 只 warning，
      # workspace 构建后 target/<target>/release/flow-server 是二者之一且不确定），
      # 所以按包分别构建、各自即刻拷出，避免拿到互相覆盖后的那一个。
      # 第二次之后的 cross 调用命中的是同一份缓存，基本不花时间。
      - name: 收集 flow-cli / flow-perf / flow-server（flow-rpc）
        run: |
          set -euo pipefail
          cross build --release --locked --target ${{ matrix.target }} \
            -p flow-cli -p flow-rpc -p backend-perf
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/flow-cli" dist/flow-cli
          cp "target/${{ matrix.target }}/release/flow-perf" dist/flow-perf
          cp "target/${{ matrix.target }}/release/flow-server" dist/flow-server
      - name: 收集 flow-server（backend-e2e 的 harness 二进制）
        run: |
          set -euo pipefail
          cross build --release --locked --target ${{ matrix.target }} -p backend-e2e
          cp "target/${{ matrix.target }}/release/flow-server" dist/flow-server-e2e
      - name: 校验产物是目标架构的 ELF
        run: |
          set -euo pipefail
          case '${{ matrix.target }}' in
            x86_64-*) want='x86-64' ;;
            aarch64-*) want='aarch64' ;;
            *) want='?' ;;
          esac
          for f in dist/*; do
            echo "== $f"
            file "$f"
            file "$f" | grep -q 'ELF 64-bit' || { echo "::error::$f 不是 ELF 64"; exit 1; }
            file "$f" | grep -q "$want" || { echo "::error::$f 架构不是 $want"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # ---- 前端：单架构 ----
  # lint / 单测 / 构建都是 node 侧的事，与 CPU 架构无关；playwright 的 e2e 里
  # 真二进制 flow-server 的架构覆盖已由上面的 test 矩阵负责（那边是全量 Rust
  # 测试），这里再铺一遍 arm 属于重复。想扩成双架构时：runs-on 换成
  # matrix.arch.runner、rust-toolchain 加 targets、rust-cache 加 key，
  # 与 test job 同构即可。
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # global-setup 自行 cargo build 并拉起隔离的 flow-server
      - run: npm run test:e2e
